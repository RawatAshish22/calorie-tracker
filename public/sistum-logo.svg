<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Sistum Tracker Logo</title>
  <desc id="desc">A luminous S shaped nutrition tracker mark with a leaf, plate, and progress ring.</desc>
  <defs>
    <linearGradient id="ring" x1="42" y1="28" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7f34a"/>
      <stop offset="0.45" stop-color="#3ee681"/>
      <stop offset="1" stop-color="#4dd5c4"/>
    </linearGradient>
    <linearGradient id="core" x1="76" y1="60" x2="180" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d7"/>
      <stop offset="0.42" stop-color="#b7f34a"/>
      <stop offset="1" stop-color="#22d3b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.95 0 0 0 0 0.6 0 0 0 0.65 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#06100d"/>
