  <path d="M154.8 82.7c-18.9-13-55.1-9.5-59.7 15.9-6.5 35.8 72.4 26.8 65.4 63.7-5.5 28.7-52.7 31.5-76.3 12.1" fill="none" stroke="url(#core)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M171 61.5c22.9 1.9 37.5 17.7 40.8 41.9-24.8-1.1-40.5-16.4-40.8-41.9Z" fill="#3ee681"/>
  <path d="M172.3 62.7c9.8 13.4 22.8 26 38 38.3" fill="none" stroke="#06100d" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
